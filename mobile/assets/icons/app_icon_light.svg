<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Light Canvas -->
    <radialGradient id="bgLightGrad" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>

    <!-- Traditional Bangladeshi Lal Khata (Crimson Leather) -->
    <linearGradient id="lalKhataGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="35%" stop-color="#DC2626" />
      <stop offset="85%" stop-color="#B91C1C" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <!-- Brass Gold (Corner Trims & Karahi Handles) -->
    <linearGradient id="brassGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE68A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Cast Iron Bangladeshi Karahi (কড়াই) -->
    <linearGradient id="karahiBodyLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="40%" stop-color="#1E293B" />
      <stop offset="80%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Sizzling Curry / Pan Food Heat Glow -->
    <radialGradient id="karahiInnerFoodLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="90%" stop-color="#9A3412" />
      <stop offset="100%" stop-color="#431407" />
    </radialGradient>

    <!-- Bazar Paper Slip Gradient (কাগজের ফর্দ) -->
    <linearGradient id="bazarSlipGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>

    <!-- Steam Gradient -->
    <linearGradient id="steamGradientLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.15" />
    </linearGradient>

    <!-- 3D Layer Shadows -->
    <filter id="bookShadowLight" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.22" />
    </filter>
    <filter id="panShadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 1. Background Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgLightGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="#CBD5E1" stroke-width="2" />

  <!-- ============================================================== -->
  <!-- 2. TRADITIONAL RED LEDGER BOOK (লাল খাতা - LAL KHATA)           -->
  <!-- ============================================================== -->
  <g filter="url(#bookShadowLight)" transform="translate(256,256) rotate(-8) translate(-256,-256)">
    <rect x="74" y="112" width="280" height="300" rx="20" fill="url(#lalKhataGradLight)" />
    
    <rect x="74" y="112" width="34" height="300" rx="6" fill="#991B1B" />
    <line x1="91" y1="126" x2="91" y2="398" stroke="#FEF3C7" stroke-width="3" stroke-dasharray="10 8" opacity="0.9" />
    
    <path d="M74 150 L74 126 C74 118 80 112 88 112 L112 112" fill="none" stroke="url(#brassGoldLight)" stroke-width="6" stroke-linecap="round" />
    <path d="M354 150 L354 126 C354 118 348 112 340 112 L316 112" fill="none" stroke="url(#brassGoldLight)" stroke-width="6" stroke-linecap="round" />
    <path d="M74 374 L74 398 C74 406 80 412 88 412 L112 412" fill="none" stroke="url(#brassGoldLight)" stroke-width="6" stroke-linecap="round" />
    <path d="M354 374 L354 398 C354 406 348 412 340 412 L316 412" fill="none" stroke="url(#brassGoldLight)" stroke-width="6" stroke-linecap="round" />

    <path d="M210 112 L210 170 L220 156 L230 170 L230 112 Z" fill="url(#brassGoldLight)" />
  </g>

  <!-- ============================================================== -->
  <!-- 3. BAZAR SHOPPING LIST (বাজারের ফর্দ / রসিদ)                    -->
  <!-- ============================================================== -->
  <g filter="url(#bookShadowLight)" transform="translate(256,256) rotate(10) translate(-256,-256)">
    <rect x="220" y="130" width="200" height="270" rx="14" fill="url(#bazarSlipGradLight)" stroke="#CBD5E1" stroke-width="1.5" />
    
    <rect x="290" y="122" width="60" height="16" rx="5" fill="url(#lalKhataGradLight)" stroke="url(#brassGoldLight)" stroke-width="1.5" />

    <!-- Line 1 (Veg) -->
    <circle cx="244" cy="168" r="6" fill="#059669" />
    <path d="M241 168 L243 170 L248 165" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <rect x="260" y="164" width="70" height="8" rx="4" fill="#64748B" />
    <rect x="370" y="164" width="30" height="8" rx="4" fill="#94A3B8" />

    <!-- Line 2 (Rice/Oil) -->
    <circle cx="244" cy="198" r="6" fill="#059669" />
    <path d="M241 198 L243 200 L248 195" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <rect x="260" y="194" width="85" height="8" rx="4" fill="#64748B" />
    <rect x="365" y="194" width="35" height="8" rx="4" fill="#94A3B8" />

    <!-- Line 3 (Meat) -->
    <circle cx="244" cy="228" r="6" fill="#059669" />
    <path d="M241 228 L243 230 L248 225" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <rect x="260" y="224" width="60" height="8" rx="4" fill="#64748B" />
    <rect x="360" y="224" width="40" height="8" rx="4" fill="#94A3B8" />

    <!-- Line 4 (Spices) -->
    <circle cx="244" cy="258" r="6" fill="#059669" />
    <path d="M241 258 L243 260 L248 255" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <rect x="260" y="254" width="75" height="8" rx="4" fill="#64748B" />
    <rect x="370" y="254" width="30" height="8" rx="4" fill="#94A3B8" />

    <line x1="236" y1="284" x2="404" y2="284" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6 4" />

    <!-- Total Hisab Badge (মোট হিসাব ৳) -->
    <rect x="236" y="300" width="168" height="42" rx="10" fill="#006A4E" />
    <text x="254" y="328" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" fill="#FDE68A">৳</text>
    <text x="276" y="328" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="16" fill="#FFFFFF">১,২৫০/-</text>
  </g>

  <!-- ============================================================== -->
  <!-- 4. BANGLADESHI COOKING PAN (কড়াই / KARAHI & ধোঁয়া)             -->
  <!-- ============================================================== -->
  <g filter="url(#panShadowLight)">
    <!-- 4.1 Rising Sizzling Hot Steam -->
    <path d="M220 180 C208 145, 230 120, 218 90" fill="none" stroke="url(#steamGradientLight)" stroke-width="7" stroke-linecap="round" />
    <path d="M260 170 C248 130, 274 105, 260 70" fill="none" stroke="url(#steamGradientLight)" stroke-width="8" stroke-linecap="round" />
    <path d="M300 180 C288 145, 310 120, 298 90" fill="none" stroke="url(#steamGradientLight)" stroke-width="7" stroke-linecap="round" />

    <!-- 4.2 Traditional Twin Loop Brass Handles -->
    <path d="M128 276 C94 276, 94 316, 128 316" fill="none" stroke="url(#brassGoldLight)" stroke-width="12" stroke-linecap="round" />
    <circle cx="132" cy="284" r="5" fill="#451A03" />
    <circle cx="132" cy="308" r="5" fill="#451A03" />

    <path d="M384 276 C418 276, 418 316, 384 316" fill="none" stroke="url(#brassGoldLight)" stroke-width="12" stroke-linecap="round" />
    <circle cx="380" cy="284" r="5" fill="#451A03" />
    <circle cx="380" cy="308" r="5" fill="#451A03" />

    <!-- 4.3 Outer Cast Iron Karahi Body -->
    <path d="M126 290 C126 386, 200 424, 256 424 C312 424, 386 386, 386 290 Z" 
          fill="url(#karahiBodyLight)" stroke="#475569" stroke-width="3" />

    <!-- 4.4 Top Pan Rim -->
    <ellipse cx="256" cy="290" rx="130" ry="46" fill="#1E293B" stroke="url(#brassGoldLight)" stroke-width="5" />

    <!-- 4.5 Delicious Sizzling Food / Curry Interior -->
    <ellipse cx="256" cy="292" rx="114" ry="36" fill="url(#karahiInnerFoodLight)" />
    <ellipse cx="256" cy="288" rx="80" ry="18" fill="#FDE68A" opacity="0.35" />

    <!-- 4.6 Spatula / Khunti -->
    <path d="M230 310 L180 200 C176 190, 186 182, 194 186 L246 295" fill="url(#brassGoldLight)" stroke="#78350F" stroke-width="2" />
    <circle cx="184" cy="192" r="5" fill="#FDE68A" />
  </g>
</svg>
