<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgDarkGrad" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#0F241E" />
      <stop offset="50%" stop-color="#081713" />
      <stop offset="100%" stop-color="#020907" />
